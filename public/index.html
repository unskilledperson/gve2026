<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14b8a6" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="description"
      content="Global Vision Education Consultants - Your Journey to World-Class Education Starts Here"
    />
    <title>Global Vision Education </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Load video IMMEDIATELY - before React renders - NO LAZY LOADING
      (function() {
        // Create video element immediately when page loads
        var preloadVideo = document.createElement('video');
        preloadVideo.preload = 'auto';
        preloadVideo.muted = true;
        preloadVideo.style.display = 'none';
        preloadVideo.style.position = 'absolute';
        preloadVideo.style.width = '1px';
        preloadVideo.style.height = '1px';
        preloadVideo.style.opacity = '0';
        preloadVideo.style.pointerEvents = 'none';
        
        // Try to find video path - will be set by webpack
        // This will force immediate loading
        if (document.body) {
          document.body.appendChild(preloadVideo);
        } else {
          document.addEventListener('DOMContentLoaded', function() {
            document.body.appendChild(preloadVideo);
          });
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Fallback for react-snap
      if (typeof window !== 'undefined' && window.snapSaveState) {
        window.snapSaveState();
      }
    </script>
  </body>
</html>
